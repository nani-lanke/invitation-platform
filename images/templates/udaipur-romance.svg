<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 600 800" width="600" height="800" role="img" aria-label="Udaipur Romance — wedding invitation template preview">
  <defs>
    <linearGradient id="bg-udaipur-romance" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F5F7FB"/>
      <stop offset="55%" stop-color="#DFE7F5"/>
      <stop offset="100%" stop-color="#F5F7FB"/>
    </linearGradient>
    <radialGradient id="gl-udaipur-romance" cx="50%" cy="34%" r="62%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="sh-udaipur-romance" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.2"/>
      <stop offset="45%" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect x="0" y="0" width="600" height="800" fill="url(#bg-udaipur-romance)"/>
  <rect x="0" y="0" width="600" height="800" fill="url(#gl-udaipur-romance)"/>
  <rect x="0" y="0" width="600" height="800" fill="url(#sh-udaipur-romance)"/>

  <!-- Custom Vector Art -->
  
      <!-- Serene Blue Lake &amp; Chhatri Palace Skyline -->
      <g stroke="#2F4D77" stroke-width="1.5" fill="none" opacity="0.65">
        <rect x="36" y="36" width="528" height="728" rx="8"/>
        <rect x="46" y="46" width="508" height="708" stroke="#C9934B" stroke-width="1" rx="6"/>
      </g>
      <!-- Lake Pichola Marble Palace &amp; Chhatri Silhouette -->
      <g transform="translate(300, 270)">
        <circle cx="0" cy="0" r="115" fill="none" stroke="#2F4D77" stroke-width="1.5" opacity="0.4"/>
        <!-- Soft Sunset Glow Circle -->
        <circle cx="0" cy="-20" r="60" fill="#C9934B" opacity="0.2"/>
        <!-- Chhatri Dome Silhouette -->
        <g fill="#2F4D77" opacity="0.85">
          <!-- Central Dome -->
          <path d="M -30 20 C -30 -20, -10 -40, 0 -45 C 10 -40, 30 -20, 30 20 Z"/>
          <rect x="-35" y="20" width="70" height="6" rx="2"/>
          <line x1="-20" y1="26" x2="-20" y2="45" stroke="#2F4D77" stroke-width="2.5"/>
          <line x1="0" y1="26" x2="0" y2="45" stroke="#2F4D77" stroke-width="2.5"/>
          <line x1="20" y1="26" x2="20" y2="45" stroke="#2F4D77" stroke-width="2.5"/>
        </g>
        <!-- Water Ripples -->
        <g stroke="#2F4D77" stroke-width="1.2" opacity="0.6">
          <line x1="-80" y1="55" x2="80" y2="55"/>
          <line x1="-60" y1="65" x2="60" y2="65" stroke-dasharray="6 4"/>
          <line x1="-40" y1="75" x2="40" y2="75" stroke-dasharray="4 4"/>
        </g>
      </g>
    

  <!-- Typography -->
  <text x="300" y="470" text-anchor="middle" font-family="Georgia, serif" font-size="19" letter-spacing="7" fill="#C9934B" opacity="0.85">LAKESIDE ROYAL WEDDING</text>
  <line x1="210" y1="495" x2="275" y2="495" stroke="#C9934B" stroke-width="1.2" opacity="0.5"/>
  <circle cx="300" cy="495" r="3.5" fill="#C9934B" opacity="0.75"/>
  <line x1="325" y1="495" x2="390" y2="495" stroke="#C9934B" stroke-width="1.2" opacity="0.5"/>

  <text x="300" y="575" text-anchor="middle" font-family="Georgia, serif" font-size="52" font-style="italic" fill="#1C2638">Udaipur Romance</text>
  <text x="300" y="630" text-anchor="middle" font-family="Georgia, serif" font-size="20" fill="#1C2638" opacity="0.72">Groom &amp; Bride</text>
  <g opacity="0.55">
    <line x1="225" y1="680" x2="375" y2="680" stroke="#C9934B" stroke-width="1"/>
  </g>
  <text x="300" y="720" text-anchor="middle" font-family="Georgia, serif" font-size="16" letter-spacing="4.5" fill="#1C2638" opacity="0.6">LAKE PICHOLA PALACE</text>
</svg>