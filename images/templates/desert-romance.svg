<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 600 800" width="600" height="800" role="img" aria-label="Desert Romance — wedding invitation template preview">
  <defs>
    <linearGradient id="bg-desert-romance" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FAF3EC"/>
      <stop offset="55%" stop-color="#EEDBC8"/>
      <stop offset="100%" stop-color="#FAF3EC"/>
    </linearGradient>
    <radialGradient id="gl-desert-romance" cx="50%" cy="34%" r="62%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="sh-desert-romance" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.2"/>
      <stop offset="45%" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect x="0" y="0" width="600" height="800" fill="url(#bg-desert-romance)"/>
  <rect x="0" y="0" width="600" height="800" fill="url(#gl-desert-romance)"/>
  <rect x="0" y="0" width="600" height="800" fill="url(#sh-desert-romance)"/>

  <!-- Custom Vector Art -->
  
      <!-- Desert Dunes &amp; Terracotta Silhouette -->
      <g stroke="#A85324" stroke-width="1.5" fill="none" opacity="0.65">
        <rect x="36" y="36" width="528" height="728" rx="8"/>
        <rect x="46" y="46" width="508" height="708" stroke="#D99B4E" stroke-width="1" rx="6"/>
      </g>
      <!-- Setting Sun &amp; Rolling Sand Dunes -->
      <g transform="translate(300, 270)">
        <circle cx="0" cy="0" r="105" fill="none" stroke="#A85324" stroke-width="1.5" opacity="0.4"/>
        <!-- Golden Setting Sun Disc -->
        <circle cx="0" cy="-20" r="50" fill="#D99B4E" opacity="0.3"/>
        <!-- Sweeping Sand Dunes -->
        <g fill="#A85324" opacity="0.8">
          <path d="M -85 50 Q -30 10 20 40 Q 60 20 85 50 Z"/>
          <path d="M -85 65 Q -10 35 40 60 Q 70 45 85 65 Z" opacity="0.6"/>
        </g>
        <!-- Desert Agave / Silhouette -->
        <g stroke="#3D2214" stroke-width="1.6" fill="none" opacity="0.85">
          <path d="M 0 50 Q -10 30 -20 25"/>
          <path d="M 0 50 Q 0 20 0 15"/>
          <path d="M 0 50 Q 10 30 20 25"/>
        </g>
      </g>
    

  <!-- Typography -->
  <text x="300" y="470" text-anchor="middle" font-family="Georgia, serif" font-size="19" letter-spacing="7" fill="#D99B4E" opacity="0.85">UNDER THE DESERT SKY</text>
  <line x1="210" y1="495" x2="275" y2="495" stroke="#D99B4E" stroke-width="1.2" opacity="0.5"/>
  <circle cx="300" cy="495" r="3.5" fill="#D99B4E" opacity="0.75"/>
  <line x1="325" y1="495" x2="390" y2="495" stroke="#D99B4E" stroke-width="1.2" opacity="0.5"/>

  <text x="300" y="575" text-anchor="middle" font-family="Georgia, serif" font-size="52" font-style="italic" fill="#3D2214">Desert Romance</text>
  <text x="300" y="630" text-anchor="middle" font-family="Georgia, serif" font-size="20" fill="#3D2214" opacity="0.72">Groom &amp; Bride</text>
  <g opacity="0.55">
    <line x1="225" y1="680" x2="375" y2="680" stroke="#D99B4E" stroke-width="1"/>
  </g>
  <text x="300" y="720" text-anchor="middle" font-family="Georgia, serif" font-size="16" letter-spacing="4.5" fill="#3D2214" opacity="0.6">DUNE WEDDING OASIS</text>
</svg>