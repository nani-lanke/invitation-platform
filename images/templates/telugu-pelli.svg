    <path d="M 0 0 Q 18 0 18 -18 Q 0 -18 0 0" fill="none" stroke="url(#gold-foil)" stroke-width="1"/>
  </g>
  <g transform="translate(566 766)">
    <circle cx="0" cy="0" r="4" fill="#996515"/>
    <path d="M 0 0 Q -18 0 -18 -18 Q 0 -18 0 0" fill="none" stroke="url(#gold-foil)" stroke-width="1"/>
  </g>

  <!-- Side Carved Temple Pillars -->
  <g id="side-pillars" opacity="0.9">
    <!-- Left Pillar -->
    <image href="../background_images/pillers_image_one/pillersimage_1.png" xlink:href="../background_images/pillers_image_one/pillersimage_1.png" x="38" y="110" width="30" height="240" preserveAspectRatio="xMidYMid meet"/>
    <!-- Right Pillar -->
    <image href="../background_images/pillers_image_one/pillersimage_1.png" xlink:href="../background_images/pillers_image_one/pillersimage_1.png" x="532" y="110" width="30" height="240" preserveAspectRatio="xMidYMid meet"/>
  </g>

  <!-- Side Jasmine Garlands -->
  <g id="jasmine-garland-left" transform="translate(53 100)">
    <use href="#white-flower" xlink:href="#white-flower" transform="translate(0 0) scale(0.8)"/>
    <use href="#white-flower" xlink:href="#white-flower" transform="translate(0 16) scale(0.8)"/>
    <use href="#marigold-flower" xlink:href="#marigold-flower" transform="translate(0 32) scale(0.55)"/>
    <use href="#white-flower" xlink:href="#white-flower" transform="translate(0 48) scale(0.8)"/>
    <use href="#white-flower" xlink:href="#white-flower" transform="translate(0 64) scale(0.8)"/>
    <use href="#marigold-flower" xlink:href="#marigold-flower" transform="translate(0 80) scale(0.55)"/>
    <use href="#white-flower" xlink:href="#white-flower" transform="translate(0 96) scale(0.8)"/>
    <use href="#white-flower" xlink:href="#white-flower" transform="translate(0 112) scale(0.8)"/>
    <use href="#marigold-flower" xlink:href="#marigold-flower" transform="translate(0 128) scale(0.55)"/>
    <use href="#white-flower" xlink:href="#white-flower" transform="translate(0 144) scale(0.8)"/>
    <circle cx="0" cy="156" r="2.5" fill="#E65100"/>
  </g>
  <g id="jasmine-garland-right" transform="translate(547 100)">
    <use href="#white-flower" xlink:href="#white-flower" transform="translate(0 0) scale(0.8)"/>
    <use href="#white-flower" xlink:href="#white-flower" transform="translate(0 16) scale(0.8)"/>
    <use href="#marigold-flower" xlink:href="#marigold-flower" transform="translate(0 32) scale(0.55)"/>
    <use href="#white-flower" xlink:href="#white-flower" transform="translate(0 48) scale(0.8)"/>
    <use href="#white-flower" xlink:href="#white-flower" transform="translate(0 64) scale(0.8)"/>
    <use href="#marigold-flower" xlink:href="#marigold-flower" transform="translate(0 80) scale(0.55)"/>
    <use href="#white-flower" xlink:href="#white-flower" transform="translate(0 96) scale(0.8)"/>
    <use href="#white-flower" xlink:href="#white-flower" transform="translate(0 112) scale(0.8)"/>
    <use href="#marigold-flower" xlink:href="#marigold-flower" transform="translate(0 128) scale(0.55)"/>
    <use href="#white-flower" xlink:href="#white-flower" transform="translate(0 144) scale(0.8)"/>
    <circle cx="0" cy="156" r="2.5" fill="#E65100"/>
  </g>

