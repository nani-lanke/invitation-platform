      <path d="M -60 4 Q 0 -6 60 4 Q 0 14 -60 4 Z" fill="none" stroke="#996515" stroke-width="0.8" opacity="0.5"/>
      <circle cx="-55" cy="0" r="2.5" fill="#D4AF37"/>
      <circle cx="-28" cy="0" r="2.5" fill="#D4AF37"/>
      <circle cx="0" cy="0" r="3.5" fill="#145A32"/>
      <circle cx="28" cy="0" r="2.5" fill="#D4AF37"/>
      <circle cx="55" cy="0" r="2.5" fill="#D4AF37"/>
      <use href="#lotus-bloom" xlink:href="#lotus-bloom" transform="translate(0 -10) scale(0.8)"/>
