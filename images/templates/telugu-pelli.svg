      <path d="M -10 36 C -10 29 -5 27 0 27 C 5 27 10 29 10 36 Z" fill="url(#gold-foil)" stroke="#996515" stroke-width="0.7"/>
      <ellipse cx="0" cy="36" rx="10" ry="3" fill="#D4AF37" stroke="#996515" stroke-width="0.6"/>
      <path d="M 0 33 C -2 30 -3 24 0 20 C 3 24 2 30 0 33 Z" fill="#FFF176" stroke="#FF9800" stroke-width="0.5"/>
      <circle cx="0" cy="27" r="8" fill="#FFF9C4" opacity="0.35"/>
    </g>
    <g id="lotus-bloom">
      <path d="M 0 6 C -8 1 -18 -4 -24 -14 C -14 -15 -6 -6 0 6 Z" fill="url(#lotus-petal)" stroke="#880E4F" stroke-width="0.5"/>
      <path d="M 0 6 C 8 1 18 -4 24 -14 C 14 -15 6 -6 0 6 Z" fill="url(#lotus-petal)" stroke="#880E4F" stroke-width="0.5"/>
      <path d="M 0 -24 C 7 -14 8 -3 0 8 C -8 -3 -7 -14 0 -24 Z" fill="url(#lotus-petal)" stroke="#880E4F" stroke-width="0.6"/>
      <path d="M 0 7 C -6 0 -14 -6 -16 -18 C -9 -17 -3 -8 0 7 Z" fill="url(#lotus-petal)" stroke="#AD1457" stroke-width="0.5"/>
      <path d="M 0 7 C 6 0 14 -6 16 -18 C 9 -17 3 -8 0 7 Z" fill="url(#lotus-petal)" stroke="#AD1457" stroke-width="0.5"/>
      <ellipse cx="0" cy="5" rx="5" ry="2.5" fill="#FDD835"/>
    </g>
