    <use href="#bell" xlink:href="#bell" transform="translate(140 42) scale(0.88)"/>
    <use href="#bell" xlink:href="#bell" transform="translate(210 38) scale(0.82)"/>
    <use href="#bell" xlink:href="#bell" transform="translate(390 38) scale(0.82)"/>
    <use href="#bell" xlink:href="#bell" transform="translate(460 42) scale(0.88)"/>
    <use href="#hanging-lamp" xlink:href="#hanging-lamp" transform="translate(525 48)"/>
