    <use href="#marigold-flower" xlink:href="#marigold-flower" transform="translate(115 180) scale(0.6)"/>
    <use href="#lotus-bloom" xlink:href="#lotus-bloom" transform="translate(525 174) scale(0.7)"/>
    <use href="#marigold-flower" xlink:href="#marigold-flower" transform="translate(485 180) scale(0.6)"/>

