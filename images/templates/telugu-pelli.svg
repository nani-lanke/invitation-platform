<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 600 800" width="600" height="800" role="img" aria-label="Telugu Pelli — traditional South Indian wedding invitation template preview">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bg-parchment" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FAF5EC"/>
      <stop offset="50%" stop-color="#F5EADB"/>
      <stop offset="100%" stop-color="#FAF5EC"/>
    </linearGradient>
    <radialGradient id="bg-glow" cx="50%" cy="45%" r="60%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="gold-foil" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#996515"/>
      <stop offset="25%" stop-color="#D4AF37"/>
      <stop offset="50%" stop-color="#FFF3A8"/>
      <stop offset="75%" stop-color="#D4AF37"/>
      <stop offset="100%" stop-color="#996515"/>
    </linearGradient>
    <linearGradient id="stone-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#8C7355"/>
      <stop offset="50%" stop-color="#AA8D6E"/>
      <stop offset="100%" stop-color="#735C40"/>
    </linearGradient>
    <linearGradient id="leaf-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2E7D32"/>
      <stop offset="60%" stop-color="#1B5E20"/>
      <stop offset="100%" stop-color="#0E3813"/>
    </linearGradient>
    <radialGradient id="marigold" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFF176"/>
      <stop offset="45%" stop-color="#FFA726"/>
      <stop offset="85%" stop-color="#E65100"/>
      <stop offset="100%" stop-color="#BF360C"/>
    </radialGradient>
    <linearGradient id="lotus-petal" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#FFF0F3"/>
      <stop offset="40%" stop-color="#F48FB1"/>
      <stop offset="80%" stop-color="#D81B60"/>
      <stop offset="100%" stop-color="#880E4F"/>
    </linearGradient>
    <linearGradient id="lake-water" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#E1EBEB" stop-opacity="0.35"/>
      <stop offset="50%" stop-color="#CFDFE0" stop-opacity="0.65"/>
      <stop offset="100%" stop-color="#B2CDD0" stop-opacity="0.9"/>
    </linearGradient>

    <!-- Reusable Symbols -->
    <g id="mango-leaf">
      <path d="M 0 0 C -7 10 -11 25 -9 38 C -7 46 0 54 0 56 C 0 54 7 46 9 38 C 11 25 7 10 0 0 Z" fill="url(#leaf-grad)" stroke="#2E5014" stroke-width="0.7"/>
      <path d="M 0 0 L 0 52" stroke="#689F38" stroke-width="0.8" opacity="0.8"/>
      <path d="M 0 14 Q -4 20 -7 24 M 0 24 Q -5 30 -7 36 M 0 14 Q 4 20 7 24 M 0 24 Q 5 30 7 36" stroke="#689F38" stroke-width="0.5" fill="none" opacity="0.6"/>
    </g>
    <g id="white-flower">
      <ellipse cx="0" cy="-6" rx="3.5" ry="6" fill="#FFFFFF" stroke="#DEC596" stroke-width="0.5"/>
      <ellipse cx="6" cy="0" rx="6" ry="3.5" fill="#FFFFFF" stroke="#DEC596" stroke-width="0.5"/>
      <ellipse cx="0" cy="6" rx="3.5" ry="6" fill="#FFFFFF" stroke="#DEC596" stroke-width="0.5"/>
      <ellipse cx="-6" cy="0" rx="6" ry="3.5" fill="#FFFFFF" stroke="#DEC596" stroke-width="0.5"/>
      <ellipse cx="4.2" cy="-4.2" rx="3.5" ry="5.5" transform="rotate(45 4.2 -4.2)" fill="#FFFDE7" stroke="#DEC596" stroke-width="0.4"/>
      <ellipse cx="4.2" cy="4.2" rx="3.5" ry="5.5" transform="rotate(-45 4.2 4.2)" fill="#FFFDE7" stroke="#DEC596" stroke-width="0.4"/>
      <ellipse cx="-4.2" cy="4.2" rx="3.5" ry="5.5" transform="rotate(45 -4.2 4.2)" fill="#FFFDE7" stroke="#DEC596" stroke-width="0.4"/>
      <ellipse cx="-4.2" cy="-4.2" rx="3.5" ry="5.5" transform="rotate(-45 -4.2 -4.2)" fill="#FFFDE7" stroke="#DEC596" stroke-width="0.4"/>
      <circle cx="0" cy="0" r="3.2" fill="#FDD835" stroke="#F57F17" stroke-width="0.4"/>
      <circle cx="0" cy="0" r="1.2" fill="#E65100"/>
    </g>
    <g id="marigold-flower">
      <circle cx="0" cy="0" r="11" fill="url(#marigold)"/>
      <circle cx="0" cy="0" r="8" fill="#FFA726" stroke="#E65100" stroke-width="0.6"/>
      <circle cx="0" cy="0" r="3.5" fill="#BF360C"/>
      <circle cx="0" cy="0" r="1.5" fill="#FFF176"/>
    </g>
    <g id="bell">
      <line x1="0" y1="0" x2="0" y2="18" stroke="#D4AF37" stroke-width="1.2"/>
      <circle cx="0" cy="18" r="2.5" fill="#996515"/>
      <path d="M -8 34 C -8 24 -4 20 0 20 C 4 20 8 24 8 34 Z" fill="url(#gold-foil)" stroke="#996515" stroke-width="0.7"/>
      <path d="M -9 34 L 9 34 L 7 36 L -7 36 Z" fill="#996515"/>
      <circle cx="0" cy="38" r="2" fill="#D4AF37"/>
    </g>
    <g id="hanging-lamp">
