  <rect x="34" y="34" width="532" height="732" fill="none" stroke="#996515" stroke-width="0.8" opacity="0.45"/>
  <rect x="42" y="42" width="516" height="716" fill="none" stroke="url(#gold-foil)" stroke-width="1.2" stroke-dasharray="6,4" opacity="0.6"/>

  <!-- Corner Flourishes -->
  <g transform="translate(34 34)">
    <circle cx="0" cy="0" r="4" fill="#996515"/>
    <path d="M 0 0 Q 18 0 18 18 Q 0 18 0 0" fill="none" stroke="url(#gold-foil)" stroke-width="1"/>
  </g>
  <g transform="translate(566 34)">
    <circle cx="0" cy="0" r="4" fill="#996515"/>
    <path d="M 0 0 Q -18 0 -18 18 Q 0 18 0 0" fill="none" stroke="url(#gold-foil)" stroke-width="1"/>
  </g>
  <g transform="translate(34 766)">
