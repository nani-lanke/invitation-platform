    <path d="M 40 40 L 560 40 L 560 52 C 440 52 380 96 300 96 C 220 96 160 52 40 52 Z" fill="#F7F1E6" stroke="#DEC596" stroke-width="0.8"/>
    <path d="M 40 52 Q 300 112 560 52" fill="none" stroke="url(#gold-foil)" stroke-width="2.4" opacity="0.85"/>
    <path d="M 40 55 Q 300 115 560 55" fill="none" stroke="#E65100" stroke-width="1.2" opacity="0.7"/>

    <!-- Mango Leaf Toran -->
    <use href="#mango-leaf" xlink:href="#mango-leaf" transform="translate(68 54) rotate(-14) scale(0.85)"/>
    <use href="#mango-leaf" xlink:href="#mango-leaf" transform="translate(112 66) rotate(-10) scale(0.85)"/>
    <use href="#mango-leaf" xlink:href="#mango-leaf" transform="translate(158 76) rotate(-6) scale(0.85)"/>
    <use href="#mango-leaf" xlink:href="#mango-leaf" transform="translate(204 84) rotate(-2) scale(0.85)"/>
    <use href="#mango-leaf" xlink:href="#mango-leaf" transform="translate(250 88) scale(0.85)"/>
    <use href="#mango-leaf" xlink:href="#mango-leaf" transform="translate(300 90) scale(0.85)"/>
    <use href="#mango-leaf" xlink:href="#mango-leaf" transform="translate(350 88) scale(0.85)"/>
    <use href="#mango-leaf" xlink:href="#mango-leaf" transform="translate(396 84) rotate(2) scale(0.85)"/>
    <use href="#mango-leaf" xlink:href="#mango-leaf" transform="translate(442 76) rotate(6) scale(0.85)"/>
    <use href="#mango-leaf" xlink:href="#mango-leaf" transform="translate(488 66) rotate(10) scale(0.85)"/>
    <use href="#mango-leaf" xlink:href="#mango-leaf" transform="translate(532 54) rotate(14) scale(0.85)"/>

    <!-- Floral Garland Beads -->
    <use href="#marigold-flower" xlink:href="#marigold-flower" transform="translate(90 62) scale(0.75)"/>
    <use href="#white-flower" xlink:href="#white-flower" transform="translate(135 73) scale(0.9)"/>
    <use href="#marigold-flower" xlink:href="#marigold-flower" transform="translate(181 82) scale(0.75)"/>
    <use href="#white-flower" xlink:href="#white-flower" transform="translate(227 88) scale(0.9)"/>
    <use href="#white-flower" xlink:href="#white-flower" transform="translate(373 88) scale(0.9)"/>
    <use href="#marigold-flower" xlink:href="#marigold-flower" transform="translate(419 82) scale(0.75)"/>
    <use href="#white-flower" xlink:href="#white-flower" transform="translate(465 73) scale(0.9)"/>
    <use href="#marigold-flower" xlink:href="#marigold-flower" transform="translate(510 62) scale(0.75)"/>

    <!-- Sacred Lord Vinayaka Centerpiece -->
    <image href="images/background_images/vinayaka_images/vinayaka_image_2.png" xlink:href="images/background_images/vinayaka_images/vinayaka_image_2.png" x="268" y="18" width="64" height="64" preserveAspectRatio="xMidYMid meet"/>

