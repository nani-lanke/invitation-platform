<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 600 800" width="600" height="800" role="img" aria-label="Maharaja Palace — wedding invitation template preview">
  <defs>
    <linearGradient id="bg-maharaja-palace" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#201309"/>
      <stop offset="55%" stop-color="#402612"/>
      <stop offset="100%" stop-color="#201309"/>
    </linearGradient>
    <radialGradient id="gl-maharaja-palace" cx="50%" cy="34%" r="62%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="sh-maharaja-palace" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.15"/>
      <stop offset="45%" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect x="0" y="0" width="600" height="800" fill="url(#bg-maharaja-palace)"/>
  <rect x="0" y="0" width="600" height="800" fill="url(#gl-maharaja-palace)"/>
  <rect x="0" y="0" width="600" height="800" fill="url(#sh-maharaja-palace)"/>

  <!-- Custom Vector Art -->
  
      <!-- Monumental Rajput Scalloped Palace Arch -->
      <g stroke="#E5B348" stroke-width="2" fill="none" opacity="0.8">
        <rect x="36" y="36" width="528" height="728" rx="6"/>
        <path d="M 80 320 L 80 200 C 80 80, 200 60, 300 60 C 400 60, 520 80, 520 200 L 520 320"/>
        <!-- Fluted Columns -->
        <line x1="100" y1="200" x2="100" y2="340" stroke-width="3"/>
        <line x1="500" y1="200" x2="500" y2="340" stroke-width="3"/>
      </g>
      <!-- Crystal Chandelier &amp; Imperial Heraldic Medallion -->
      <g transform="translate(300, 240)">
        <!-- Chandelier Droplets -->
        <g stroke="#F7D788" stroke-width="1.2" fill="none" opacity="0.85">
          <line x1="0" y1="-80" x2="0" y2="-20"/>
          <path d="M -40 -20 Q 0 10 40 -20"/>
          <path d="M -60 -20 Q 0 25 60 -20"/>
          <circle cx="-60" cy="0" r="3" fill="#E5B348"/><circle cx="-40" cy="-5" r="3" fill="#E5B348"/><circle cx="-20" cy="-10" r="3" fill="#E5B348"/><circle cx="0" cy="-15" r="3" fill="#E5B348"/><circle cx="20" cy="-10" r="3" fill="#E5B348"/><circle cx="40" cy="-5" r="3" fill="#E5B348"/><circle cx="60" cy="0" r="3" fill="#E5B348"/>
        </g>
        <!-- Royal Crest -->
        <circle cx="0" cy="40" r="45" fill="#201309" stroke="#E5B348" stroke-width="2.5"/>
        <circle cx="0" cy="40" r="35" fill="none" stroke="#F7D788" stroke-width="1" stroke-dasharray="3 3"/>
        <polygon points="0,15 12,35 30,35 15,48 22,68 0,55 -22,68 -15,48 -30,35 -12,35" fill="#E5B348"/>
      </g>
    

  <!-- Typography -->
  <text x="300" y="470" text-anchor="middle" font-family="Georgia, serif" font-size="19" letter-spacing="7" fill="#F7D788" opacity="0.85">BY IMPERIAL INVITATION</text>
  <line x1="210" y1="495" x2="275" y2="495" stroke="#F7D788" stroke-width="1.2" opacity="0.5"/>
  <circle cx="300" cy="495" r="3.5" fill="#F7D788" opacity="0.75"/>
  <line x1="325" y1="495" x2="390" y2="495" stroke="#F7D788" stroke-width="1.2" opacity="0.5"/>

  <text x="300" y="575" text-anchor="middle" font-family="Georgia, serif" font-size="52" font-style="italic" fill="#FDF5E6">Maharaja Palace</text>
  <text x="300" y="630" text-anchor="middle" font-family="Georgia, serif" font-size="20" fill="#FDF5E6" opacity="0.72">Groom &amp; Bride</text>
  <g opacity="0.55">
    <line x1="225" y1="680" x2="375" y2="680" stroke="#F7D788" stroke-width="1"/>
  </g>
  <text x="300" y="720" text-anchor="middle" font-family="Georgia, serif" font-size="16" letter-spacing="4.5" fill="#FDF5E6" opacity="0.6">DURBAR PALACE WEDDING</text>
</svg>