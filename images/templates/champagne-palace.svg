<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 600 800" width="600" height="800" role="img" aria-label="Champagne Palace — wedding invitation template preview">
  <defs>
    <linearGradient id="bg-champagne-palace" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FAF7F0"/>
      <stop offset="55%" stop-color="#EDE5D4"/>
      <stop offset="100%" stop-color="#FAF7F0"/>
    </linearGradient>
    <radialGradient id="gl-champagne-palace" cx="50%" cy="34%" r="62%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="sh-champagne-palace" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.2"/>
      <stop offset="45%" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect x="0" y="0" width="600" height="800" fill="url(#bg-champagne-palace)"/>
  <rect x="0" y="0" width="600" height="800" fill="url(#gl-champagne-palace)"/>
  <rect x="0" y="0" width="600" height="800" fill="url(#sh-champagne-palace)"/>

  <!-- Custom Vector Art -->
  
      <!-- Slender Neoclassical Arches &amp; Editorial Fine Lines -->
      <g stroke="#CDB388" stroke-width="1.2" fill="none" opacity="0.75">
        <rect x="40" y="40" width="520" height="720" rx="100"/>
        <rect x="50" y="50" width="500" height="700" stroke="#8C7355" stroke-width="0.8" rx="90"/>
      </g>
      <!-- Modern Champagne Spun-Silk Medallion -->
      <g transform="translate(300, 260)">
        <circle cx="0" cy="0" r="95" fill="none" stroke="#CDB388" stroke-width="1" opacity="0.4"/>
        <!-- Slender Double Arch Vignette -->
        <path d="M -50 60 L -50 0 C -50 -40, 50 -40, 50 0 L 50 60" fill="none" stroke="#8C7355" stroke-width="1.6"/>
        <path d="M -35 60 L -35 5 C -35 -25, 35 -25, 35 5 L 35 60" fill="none" stroke="#CDB388" stroke-width="1"/>
        <circle cx="0" cy="-5" r="8" fill="#CDB388" opacity="0.85"/>
        <circle cx="0" cy="-5" r="3" fill="#FAF7F0"/>
      </g>
    

  <!-- Typography -->
  <text x="300" y="470" text-anchor="middle" font-family="Georgia, serif" font-size="19" letter-spacing="7" fill="#CDB388" opacity="0.85">AN EVENING OF ELEGANCE</text>
  <line x1="210" y1="495" x2="275" y2="495" stroke="#CDB388" stroke-width="1.2" opacity="0.5"/>
  <circle cx="300" cy="495" r="3.5" fill="#CDB388" opacity="0.75"/>
  <line x1="325" y1="495" x2="390" y2="495" stroke="#CDB388" stroke-width="1.2" opacity="0.5"/>

  <text x="300" y="575" text-anchor="middle" font-family="Georgia, serif" font-size="52" font-style="italic" fill="#302A24">Champagne Palace</text>
  <text x="300" y="630" text-anchor="middle" font-family="Georgia, serif" font-size="20" fill="#302A24" opacity="0.72">Groom &amp; Bride</text>
  <g opacity="0.55">
    <line x1="225" y1="680" x2="375" y2="680" stroke="#CDB388" stroke-width="1"/>
  </g>
  <text x="300" y="720" text-anchor="middle" font-family="Georgia, serif" font-size="16" letter-spacing="4.5" fill="#302A24" opacity="0.6">BLACK TIE OPTIONAL</text>
