<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 600 800" width="600" height="800" role="img" aria-label="Jewel of Jaipur — wedding invitation template preview">
  <defs>
    <linearGradient id="bg-jewel-of-jaipur" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FDF3F0"/>
      <stop offset="55%" stop-color="#F5DDD4"/>
      <stop offset="100%" stop-color="#FDF3F0"/>
    </linearGradient>
    <radialGradient id="gl-jewel-of-jaipur" cx="50%" cy="34%" r="62%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="sh-jewel-of-jaipur" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.2"/>
      <stop offset="45%" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect x="0" y="0" width="600" height="800" fill="url(#bg-jewel-of-jaipur)"/>
  <rect x="0" y="0" width="600" height="800" fill="url(#gl-jewel-of-jaipur)"/>
  <rect x="0" y="0" width="600" height="800" fill="url(#sh-jewel-of-jaipur)"/>

  <!-- Custom Vector Art -->
  
      <!-- Jaipur Jharokha Scalloped Arch &amp; Stone Lattice -->
      <g stroke="#C04E58" stroke-width="1.6" fill="none" opacity="0.65">
        <rect x="36" y="36" width="528" height="728" rx="10"/>
        <rect x="46" y="46" width="508" height="708" stroke="#D49B42" stroke-width="1" stroke-dasharray="4 4" rx="8"/>
      </g>
      <!-- Jharokha Window Centerpiece with Gemstone Accents -->
      <g transform="translate(300, 260)">
        <!-- Carved Jharokha Dome -->
        <path d="M -100 80 L -100 -20 C -100 -80, -50 -120, 0 -130 C 50 -120, 100 -80, 100 -20 L 100 80 Z" fill="#FDF3F0" stroke="#C04E58" stroke-width="2.5" opacity="0.95"/>
        <!-- Inner Lattice Jaali -->
        <g stroke="#D49B42" stroke-width="0.8" opacity="0.45">
          <line x1="-60" y1="-40" x2="-60" y2="70"/><line x1="-30" y1="-40" x2="-30" y2="70"/><line x1="0" y1="-40" x2="0" y2="70"/><line x1="30" y1="-40" x2="30" y2="70"/><line x1="60" y1="-40" x2="60" y2="70"/>
          <line x1="-80" y1="-20" x2="80" y2="-20"/><line x1="-80" y1="10" x2="80" y2="10"/><line x1="-80" y1="40" x2="80" y2="40"/><line x1="-80" y1="70" x2="80" y2="70"/>
        </g>
        <!-- Pink City Ruby &amp; Emerald Gemstone Inset -->
        <circle cx="0" cy="-60" r="16" fill="#C04E58" stroke="#D49B42" stroke-width="2"/>
        <circle cx="0" cy="-60" r="8" fill="#D49B42"/>
        <!-- Flanking Jaipur Peacocks -->
        <circle cx="-130" cy="20" r="25" fill="#D49B42" opacity="0.2"/>
        <circle cx="130" cy="20" r="25" fill="#D49B42" opacity="0.2"/>
      </g>
    

  <!-- Typography -->
  <text x="300" y="470" text-anchor="middle" font-family="Georgia, serif" font-size="19" letter-spacing="7" fill="#D49B42" opacity="0.85">ROYAL RAJPUTANA WEDDING</text>
  <line x1="210" y1="495" x2="275" y2="495" stroke="#D49B42" stroke-width="1.2" opacity="0.5"/>
  <circle cx="300" cy="495" r="3.5" fill="#D49B42" opacity="0.75"/>
  <line x1="325" y1="495" x2="390" y2="495" stroke="#D49B42" stroke-width="1.2" opacity="0.5"/>

  <text x="300" y="575" text-anchor="middle" font-family="Georgia, serif" font-size="52" font-style="italic" fill="#3D1C1E">Jewel of Jaipur</text>
  <text x="300" y="630" text-anchor="middle" font-family="Georgia, serif" font-size="20" fill="#3D1C1E" opacity="0.72">Groom &amp; Bride</text>
  <g opacity="0.55">
    <line x1="225" y1="680" x2="375" y2="680" stroke="#D49B42" stroke-width="1"/>
  </g>
  <text x="300" y="720" text-anchor="middle" font-family="Georgia, serif" font-size="16" letter-spacing="4.5" fill="#3D1C1E" opacity="0.6">PINK CITY CELEBRATIONS</text>
</svg>