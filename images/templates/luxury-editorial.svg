<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 600 800" width="600" height="800" role="img" aria-label="Luxury Editorial — wedding invitation template preview">
  <defs>
    <linearGradient id="bg-luxury-editorial" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F5F4F0"/>
      <stop offset="55%" stop-color="#E3E0D8"/>
      <stop offset="100%" stop-color="#F5F4F0"/>
    </linearGradient>
    <radialGradient id="gl-luxury-editorial" cx="50%" cy="34%" r="62%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="sh-luxury-editorial" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.2"/>
      <stop offset="45%" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect x="0" y="0" width="600" height="800" fill="url(#bg-luxury-editorial)"/>
  <rect x="0" y="0" width="600" height="800" fill="url(#gl-luxury-editorial)"/>
  <rect x="0" y="0" width="600" height="800" fill="url(#sh-luxury-editorial)"/>

  <!-- Custom Vector Art -->
  
      <!-- High-Fashion Magazine Layout &amp; Asymmetric Column Rules -->
      <g stroke="#121212" fill="none">
        <line x1="44" y1="44" x2="556" y2="44" stroke-width="2"/>
        <line x1="44" y1="52" x2="556" y2="52" stroke-width="0.8"/>
        <line x1="44" y1="756" x2="556" y2="756" stroke-width="2"/>
        <line x1="120" y1="120" x2="120" y2="420" stroke-width="0.8" opacity="0.4"/>
      </g>
      <!-- Fashion Masthead Editorial Vignette -->
      <g transform="translate(300, 240)">
        <rect x="-140" y="-80" width="280" height="150" fill="none" stroke="#121212" stroke-width="1.2" opacity="0.6"/>
        <text x="0" y="-30" text-anchor="middle" font-family="Futura, Arial, sans-serif" font-size="14" letter-spacing="8" fill="#757065">SPECIAL EDITION</text>
        <text x="0" y="30" text-anchor="middle" font-family="Georgia, serif" font-size="62" font-style="italic" fill="#121212">Vows</text>
      </g>
    

  <!-- Typography -->
  <text x="300" y="470" text-anchor="middle" font-family="Georgia, serif" font-size="19" letter-spacing="7" fill="#757065" opacity="0.85">THE WEDDING ISSUE · VOL. 1</text>
  <line x1="210" y1="495" x2="275" y2="495" stroke="#757065" stroke-width="1.2" opacity="0.5"/>
  <circle cx="300" cy="495" r="3.5" fill="#757065" opacity="0.75"/>
  <line x1="325" y1="495" x2="390" y2="495" stroke="#757065" stroke-width="1.2" opacity="0.5"/>

  <text x="300" y="575" text-anchor="middle" font-family="Georgia, serif" font-size="52" font-style="italic" fill="#121212">Luxury Editorial</text>
  <text x="300" y="630" text-anchor="middle" font-family="Futura, Arial, sans-serif" font-size="20" fill="#121212" opacity="0.72">Groom &amp; Bride</text>
  <g opacity="0.55">
    <line x1="225" y1="680" x2="375" y2="680" stroke="#757065" stroke-width="1"/>
  </g>
  <text x="300" y="720" text-anchor="middle" font-family="Futura, Arial, sans-serif" font-size="16" letter-spacing="4.5" fill="#121212" opacity="0.6">SAVE THE DATE · 2026</text>
</svg>