<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 600 800" width="600" height="800" role="img" aria-label="European Escape — wedding invitation template preview">
  <defs>
    <linearGradient id="bg-european-escape" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F9F7F2"/>
      <stop offset="55%" stop-color="#ECE6D8"/>
      <stop offset="100%" stop-color="#F9F7F2"/>
    </linearGradient>
    <radialGradient id="gl-european-escape" cx="50%" cy="34%" r="62%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="sh-european-escape" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.2"/>
      <stop offset="45%" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect x="0" y="0" width="600" height="800" fill="url(#bg-european-escape)"/>
  <rect x="0" y="0" width="600" height="800" fill="url(#gl-european-escape)"/>
  <rect x="0" y="0" width="600" height="800" fill="url(#sh-european-escape)"/>

  <!-- Custom Vector Art -->
  
      <!-- Tuscan Olive Branch Wreath &amp; Deckled Frame -->
      <g stroke="#5C6B57" stroke-width="1.4" fill="none" opacity="0.65">
        <rect x="36" y="36" width="528" height="728" rx="6"/>
        <rect x="46" y="46" width="508" height="708" stroke="#B89262" stroke-width="1" stroke-dasharray="6 3"/>
      </g>
      <!-- Tuscan Villa Olive Wreath Centerpiece -->
      <g transform="translate(300, 270)">
        <circle cx="0" cy="0" r="105" fill="none" stroke="#B89262" stroke-width="1.5" opacity="0.45"/>
        <!-- Circular Olive Wreath -->
        <g stroke="#5C6B57" stroke-width="1.8" fill="none" opacity="0.8">
          <path d="M 0 -80 C -60 -80, -80 -20, -80 0 C -80 40, -40 80, 0 80"/>
          <path d="M 0 -80 C 60 -80, 80 -20, 80 0 C 80 40, 40 80, 0 80"/>
        </g>
        <!-- Olive Leaves -->
        <g fill="#5C6B57" opacity="0.75">
          
            <ellipse cx="-40" cy="-65" rx="10" ry="5" transform="rotate(-30 -40 -65)"/>
          
            <ellipse cx="-70" cy="-35" rx="10" ry="5" transform="rotate(-30 -70 -35)"/>
          
            <ellipse cx="-75" cy="10" rx="10" ry="5" transform="rotate(-30 -75 10)"/>
          
            <ellipse cx="-55" cy="55" rx="10" ry="5" transform="rotate(-30 -55 55)"/>
          
            <ellipse cx="40" cy="-65" rx="10" ry="5" transform="rotate(30 40 -65)"/>
          
            <ellipse cx="70" cy="-35" rx="10" ry="5" transform="rotate(30 70 -35)"/>
          
            <ellipse cx="75" cy="10" rx="10" ry="5" transform="rotate(30 75 10)"/>
          
            <ellipse cx="55" cy="55" rx="10" ry="5" transform="rotate(30 55 55)"/>
          
        </g>
        <!-- Black Olives -->
        <circle cx="-50" cy="-45" r="4" fill="#2D2720"/>
        <circle cx="50" cy="-45" r="4" fill="#2D2720"/>
        <circle cx="-65" cy="30" r="4" fill="#2D2720"/>
        <circle cx="65" cy="30" r="4" fill="#2D2720"/>
        <!-- Center Ribbon Bow -->
        <circle cx="0" cy="80" r="8" fill="#B89262"/>
      </g>
    

  <!-- Typography -->
  <text x="300" y="470" text-anchor="middle" font-family="Georgia, serif" font-size="19" letter-spacing="7" fill="#B89262" opacity="0.85">A DESTINATION LOVE STORY</text>
  <line x1="210" y1="495" x2="275" y2="495" stroke="#B89262" stroke-width="1.2" opacity="0.5"/>
  <circle cx="300" cy="495" r="3.5" fill="#B89262" opacity="0.75"/>
  <line x1="325" y1="495" x2="390" y2="495" stroke="#B89262" stroke-width="1.2" opacity="0.5"/>

  <text x="300" y="575" text-anchor="middle" font-family="Georgia, serif" font-size="52" font-style="italic" fill="#2D2720">European Escape</text>
  <text x="300" y="630" text-anchor="middle" font-family="Georgia, serif" font-size="20" fill="#2D2720" opacity="0.72">Groom &amp; Bride</text>
  <g opacity="0.55">
    <line x1="225" y1="680" x2="375" y2="680" stroke="#B89262" stroke-width="1"/>
  </g>
  <text x="300" y="720" text-anchor="middle" font-family="Georgia, serif" font-size="16" letter-spacing="4.5" fill="#2D2720" opacity="0.6">TUSCAN VILLA VOWS</text>
</svg>