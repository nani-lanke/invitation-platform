<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 600 800" width="600" height="800" role="img" aria-label="Beachside Bliss — wedding invitation template preview">
  <defs>
    <linearGradient id="bg-beachside-bliss" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F6FAFA"/>
      <stop offset="55%" stop-color="#DCEDF0"/>
      <stop offset="100%" stop-color="#F6FAFA"/>
    </linearGradient>
    <radialGradient id="gl-beachside-bliss" cx="50%" cy="34%" r="62%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="sh-beachside-bliss" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.2"/>
      <stop offset="45%" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect x="0" y="0" width="600" height="800" fill="url(#bg-beachside-bliss)"/>
  <rect x="0" y="0" width="600" height="800" fill="url(#gl-beachside-bliss)"/>
  <rect x="0" y="0" width="600" height="800" fill="url(#sh-beachside-bliss)"/>

  <!-- Custom Vector Art -->
  
      <!-- Ocean Waves &amp; Seashell Coastal Crest -->
      <g stroke="#2A7B9B" stroke-width="1.5" fill="none" opacity="0.65">
        <rect x="36" y="36" width="528" height="728" rx="8"/>
        <rect x="46" y="46" width="508" height="708" stroke="#D9A05B" stroke-width="1" rx="6"/>
      </g>
      <!-- Stylized Rolling Waves &amp; Shell Vignette -->
      <g transform="translate(300, 270)">
        <circle cx="0" cy="0" r="105" fill="none" stroke="#2A7B9B" stroke-width="1.5" opacity="0.4"/>
        <!-- Horizon &amp; Sun Disc -->
        <circle cx="0" cy="-25" r="45" fill="#D9A05B" opacity="0.25"/>
        <!-- Ocean Wave Curves -->
        <g stroke="#2A7B9B" stroke-width="2.2" fill="none" opacity="0.8">
          <path d="M -80 15 C -50 -10, -30 30, 0 15 C 30 -10, 50 30, 80 15"/>
          <path d="M -70 35 C -40 10, -20 50, 10 35 C 40 10, 60 50, 90 35" stroke="#2A7B9B" stroke-width="1.5" opacity="0.6"/>
        </g>
        <!-- Scallop Shell Center Motif -->
        <g fill="#D9A05B" stroke="#102E38" stroke-width="1" opacity="0.9">
          <path d="M 0 -50 C -25 -50, -35 -20, 0 0 C 35 -20, 25 -50, 0 -50 Z"/>
          <line x1="0" y1="0" x2="-15" y2="-40" stroke="#102E38" stroke-width="0.8"/>
          <line x1="0" y1="0" x2="0" y2="-48" stroke="#102E38" stroke-width="0.8"/>
          <line x1="0" y1="0" x2="15" y2="-40" stroke="#102E38" stroke-width="0.8"/>
        </g>
      </g>
    

  <!-- Typography -->
  <text x="300" y="470" text-anchor="middle" font-family="Georgia, serif" font-size="19" letter-spacing="7" fill="#D9A05B" opacity="0.85">VOWS BY THE SHORELINE</text>
  <line x1="210" y1="495" x2="275" y2="495" stroke="#D9A05B" stroke-width="1.2" opacity="0.5"/>
  <circle cx="300" cy="495" r="3.5" fill="#D9A05B" opacity="0.75"/>
  <line x1="325" y1="495" x2="390" y2="495" stroke="#D9A05B" stroke-width="1.2" opacity="0.5"/>

  <text x="300" y="575" text-anchor="middle" font-family="Georgia, serif" font-size="52" font-style="italic" fill="#102E38">Beachside Bliss</text>
  <text x="300" y="630" text-anchor="middle" font-family="Georgia, serif" font-size="20" fill="#102E38" opacity="0.72">Groom &amp; Bride</text>
  <g opacity="0.55">
    <line x1="225" y1="680" x2="375" y2="680" stroke="#D9A05B" stroke-width="1"/>
  </g>
  <text x="300" y="720" text-anchor="middle" font-family="Georgia, serif" font-size="16" letter-spacing="4.5" fill="#102E38" opacity="0.6">COASTAL RECEPTION</text>
</svg>