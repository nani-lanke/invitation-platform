<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 600 800" width="600" height="800" role="img" aria-label="Lakefront Love — wedding invitation template preview">
  <defs>
    <linearGradient id="bg-lakefront-love" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F4F8FA"/>
      <stop offset="55%" stop-color="#D8E7EE"/>
      <stop offset="100%" stop-color="#F4F8FA"/>
    </linearGradient>
    <radialGradient id="gl-lakefront-love" cx="50%" cy="34%" r="62%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="sh-lakefront-love" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.2"/>
      <stop offset="45%" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect x="0" y="0" width="600" height="800" fill="url(#bg-lakefront-love)"/>
  <rect x="0" y="0" width="600" height="800" fill="url(#gl-lakefront-love)"/>
  <rect x="0" y="0" width="600" height="800" fill="url(#sh-lakefront-love)"/>

  <!-- Custom Vector Art -->
  
      <!-- Alpine Mountain Ridges &amp; Mirrored Water Horizon -->
      <g stroke="#325A77" stroke-width="1.5" fill="none" opacity="0.65">
        <rect x="36" y="36" width="528" height="728" rx="8"/>
        <rect x="46" y="46" width="508" height="708" stroke="#92B4A7" stroke-width="1" rx="6"/>
      </g>
      <!-- Mountain Skyline &amp; Lake Reeds -->
      <g transform="translate(300, 270)">
        <circle cx="0" cy="0" r="110" fill="none" stroke="#325A77" stroke-width="1.5" opacity="0.4"/>
        <!-- Misty Mountains -->
        <polygon points="-70,25 -30,-30 10,25" fill="#92B4A7" opacity="0.4"/>
        <polygon points="-20,25 25,-45 70,25" fill="#325A77" opacity="0.5"/>
        <!-- Lake Horizon Line &amp; Reflection -->
        <line x1="-80" y1="25" x2="80" y2="25" stroke="#325A77" stroke-width="2"/>
        <line x1="-60" y1="38" x2="60" y2="38" stroke="#92B4A7" stroke-width="1.5" stroke-dasharray="8 4"/>
        <line x1="-40" y1="50" x2="40" y2="50" stroke="#325A77" stroke-width="1" stroke-dasharray="5 5"/>
        <!-- Lake Water Reeds -->
        <g stroke="#325A77" stroke-width="1.8" fill="none" opacity="0.8">
          <line x1="-55" y1="55" x2="-60" y2="5"/>
          <line x1="-50" y1="55" x2="-45" y2="0"/>
          <line x1="50" y1="55" x2="45" y2="5"/>
          <line x1="55" y1="55" x2="60" y2="0"/>
        </g>
      </g>
    

  <!-- Typography -->
  <text x="300" y="470" text-anchor="middle" font-family="Georgia, serif" font-size="19" letter-spacing="7" fill="#92B4A7" opacity="0.85">BY THE WATER'S EDGE</text>
  <line x1="210" y1="495" x2="275" y2="495" stroke="#92B4A7" stroke-width="1.2" opacity="0.5"/>
  <circle cx="300" cy="495" r="3.5" fill="#92B4A7" opacity="0.75"/>
  <line x1="325" y1="495" x2="390" y2="495" stroke="#92B4A7" stroke-width="1.2" opacity="0.5"/>

  <text x="300" y="575" text-anchor="middle" font-family="Georgia, serif" font-size="52" font-style="italic" fill="#182834">Lakefront Love</text>
  <text x="300" y="630" text-anchor="middle" font-family="Georgia, serif" font-size="20" fill="#182834" opacity="0.72">Groom &amp; Bride</text>
  <g opacity="0.55">
    <line x1="225" y1="680" x2="375" y2="680" stroke="#92B4A7" stroke-width="1"/>
  </g>
  <text x="300" y="720" text-anchor="middle" font-family="Georgia, serif" font-size="16" letter-spacing="4.5" fill="#182834" opacity="0.6">LAKESIDE CEREMONY</text>
</svg>