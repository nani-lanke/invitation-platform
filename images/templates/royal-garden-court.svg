<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 600 800" width="600" height="800" role="img" aria-label="Royal Garden Court — wedding invitation template preview">
  <defs>
    <linearGradient id="bg-royal-garden-court" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F6F8F3"/>
      <stop offset="55%" stop-color="#E0E7D7"/>
      <stop offset="100%" stop-color="#F6F8F3"/>
    </linearGradient>
    <radialGradient id="gl-royal-garden-court" cx="50%" cy="34%" r="62%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="sh-royal-garden-court" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.2"/>
      <stop offset="45%" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect x="0" y="0" width="600" height="800" fill="url(#bg-royal-garden-court)"/>
  <rect x="0" y="0" width="600" height="800" fill="url(#gl-royal-garden-court)"/>
  <rect x="0" y="0" width="600" height="800" fill="url(#sh-royal-garden-court)"/>

  <!-- Custom Vector Art -->
  
      <!-- Formal Wrought Iron Palace Gate &amp; Rose Garland -->
      <g stroke="#3C6342" stroke-width="1.5" fill="none" opacity="0.65">
        <rect x="36" y="36" width="528" height="728" rx="8"/>
        <rect x="46" y="46" width="508" height="708" stroke="#B88E44" stroke-width="1" rx="6"/>
      </g>
      <!-- Wrought Iron Gate &amp; Climbing Garden Roses -->
      <g transform="translate(300, 270)">
        <circle cx="0" cy="0" r="105" fill="none" stroke="#3C6342" stroke-width="1.5" opacity="0.4"/>
        <!-- Gate Scallop Scrolls -->
        <g stroke="#B88E44" stroke-width="1.8" fill="none" opacity="0.85">
          <path d="M -70 20 C -70 -30, -20 -50, 0 -20 C 20 -50, 70 -30, 70 20"/>
          <path d="M -50 40 C -50 0, -10 -20, 0 10 C 10 -20, 50 0, 50 40"/>
        </g>
        <!-- Blooming Garden Rose Sprays -->
        <g fill="#A64B5D" opacity="0.85">
          <circle cx="-55" cy="-20" r="10"/>
          <circle cx="55" cy="-20" r="10"/>
          <circle cx="0" cy="-55" r="12"/>
        </g>
        <g fill="#3C6342" opacity="0.7">
          <ellipse cx="-70" cy="-20" rx="8" ry="4" transform="rotate(-30 -70 -20)"/>
          <ellipse cx="70" cy="-20" rx="8" ry="4" transform="rotate(30 70 -20)"/>
          <ellipse cx="-15" cy="-65" rx="8" ry="4" transform="rotate(-45 -15 -65)"/>
          <ellipse cx="15" cy="-65" rx="8" ry="4" transform="rotate(45 15 -65)"/>
        </g>
      </g>
    

  <!-- Typography -->
  <text x="300" y="470" text-anchor="middle" font-family="Georgia, serif" font-size="19" letter-spacing="7" fill="#B88E44" opacity="0.85">IN THE GARDEN OF CELEBRATION</text>
  <line x1="210" y1="495" x2="275" y2="495" stroke="#B88E44" stroke-width="1.2" opacity="0.5"/>
  <circle cx="300" cy="495" r="3.5" fill="#B88E44" opacity="0.75"/>
  <line x1="325" y1="495" x2="390" y2="495" stroke="#B88E44" stroke-width="1.2" opacity="0.5"/>

  <text x="300" y="575" text-anchor="middle" font-family="Georgia, serif" font-size="52" font-style="italic" fill="#1E2E20">Royal Garden Court</text>
  <text x="300" y="630" text-anchor="middle" font-family="Georgia, serif" font-size="20" fill="#1E2E20" opacity="0.72">Groom &amp; Bride</text>
  <g opacity="0.55">
    <line x1="225" y1="680" x2="375" y2="680" stroke="#B88E44" stroke-width="1"/>
  </g>
  <text x="300" y="720" text-anchor="middle" font-family="Georgia, serif" font-size="16" letter-spacing="4.5" fill="#1E2E20" opacity="0.6">ORANGERIE RECEPTION</text>
</svg>