        <!-- Large Monstera Leaves -->
        <g fill="#1F6B45" opacity="0.75">
          <path d="M 0 40 C -70 20, -90 -40, -40 -70 C 0 -60, -10 0, 0 40 Z"/>
          <path d="M 0 40 C 70 20, 90 -40, 40 -70 C 0 -60, 10 0, 0 40 Z"/>
        </g>
        <!-- Red Hibiscus Bloom -->
        <g transform="translate(0, -20)" fill="#D65A31" opacity="0.9">
          
            <ellipse cx="20" cy="0" rx="18" ry="12" transform="rotate(0 20 0)"/>
          
            <ellipse cx="6.180339887498949" cy="19.02113032590307" rx="18" ry="12" transform="rotate(72 6.180339887498949 19.02113032590307)"/>
          
            <ellipse cx="-16.180339887498945" cy="11.755705045849465" rx="18" ry="12" transform="rotate(144 -16.180339887498945 11.755705045849465)"/>
          
            <ellipse cx="-16.18033988749895" cy="-11.75570504584946" rx="18" ry="12" transform="rotate(216 -16.18033988749895 -11.75570504584946)"/>
          
            <ellipse cx="6.180339887498945" cy="-19.021130325903073" rx="18" ry="12" transform="rotate(288 6.180339887498945 -19.021130325903073)"/>
          
          <circle cx="0" cy="0" r="8" fill="#FFF8EE"/>
          <line x1="0" y1="0" x2="0" y2="-22" stroke="#FFF8EE" stroke-width="2.5"/>
          <circle cx="0" cy="-24" r="3" fill="#D65A31"/>
        </g>
      </g>
    

  <!-- Typography -->
  <text x="300" y="470" text-anchor="middle" font-family="Georgia, serif" font-size="19" letter-spacing="7" fill="#D65A31" opacity="0.85">CELEBRATING OUR UNION</text>
  <line x1="210" y1="495" x2="275" y2="495" stroke="#D65A31" stroke-width="1.2" opacity="0.5"/>
  <circle cx="300" cy="495" r="3.5" fill="#D65A31" opacity="0.75"/>
  <line x1="325" y1="495" x2="390" y2="495" stroke="#D65A31" stroke-width="1.2" opacity="0.5"/>

  <text x="300" y="575" text-anchor="middle" font-family="Georgia, serif" font-size="52" font-style="italic" fill="#142E20">Tropical Paradise</text>
  <text x="300" y="630" text-anchor="middle" font-family="Georgia, serif" font-size="20" fill="#142E20" opacity="0.72">Groom &amp; Bride</text>
