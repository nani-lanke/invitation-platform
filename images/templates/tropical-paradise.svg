<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 600 800" width="600" height="800" role="img" aria-label="Tropical Paradise — wedding invitation template preview">
  <defs>
    <linearGradient id="bg-tropical-paradise" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F3F8F5"/>
      <stop offset="55%" stop-color="#D9ECE0"/>
      <stop offset="100%" stop-color="#F3F8F5"/>
    </linearGradient>
    <radialGradient id="gl-tropical-paradise" cx="50%" cy="34%" r="62%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="sh-tropical-paradise" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.2"/>
      <stop offset="45%" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect x="0" y="0" width="600" height="800" fill="url(#bg-tropical-paradise)"/>
  <rect x="0" y="0" width="600" height="800" fill="url(#gl-tropical-paradise)"/>
  <rect x="0" y="0" width="600" height="800" fill="url(#sh-tropical-paradise)"/>

  <!-- Custom Vector Art -->
  
      <!-- Monstera Fronds &amp; Exotic Hibiscus Wreath -->
      <g stroke="#1F6B45" stroke-width="1.5" fill="none" opacity="0.65">
        <rect x="36" y="36" width="528" height="728" rx="8"/>
        <rect x="46" y="46" width="508" height="708" stroke="#D65A31" stroke-width="1" rx="6"/>
      </g>
      <!-- Tropical Monstera &amp; Hibiscus Vignette -->
