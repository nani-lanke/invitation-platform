<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 600 800" width="600" height="800" role="img" aria-label="Wildflower Vows — wedding invitation template preview">
  <defs>
    <linearGradient id="bg-wildflower-vows" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F9F8F3"/>
      <stop offset="55%" stop-color="#EDEBDC"/>
      <stop offset="100%" stop-color="#F9F8F3"/>
    </linearGradient>
    <radialGradient id="gl-wildflower-vows" cx="50%" cy="34%" r="62%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="sh-wildflower-vows" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.2"/>
      <stop offset="45%" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect x="0" y="0" width="600" height="800" fill="url(#bg-wildflower-vows)"/>
  <rect x="0" y="0" width="600" height="800" fill="url(#gl-wildflower-vows)"/>
  <rect x="0" y="0" width="600" height="800" fill="url(#sh-wildflower-vows)"/>

  <!-- Custom Vector Art -->
  
      <!-- Natural Meadow Grasses &amp; Wildflower Sprays -->
      <g stroke="#556B2F" stroke-width="1.2" fill="none" opacity="0.6">
        <rect x="38" y="38" width="524" height="724" stroke-dasharray="8 4" rx="4"/>
      </g>
      <!-- Wild Botanical Meadow Bunch -->
      <g transform="translate(300, 270)">
        <circle cx="0" cy="0" r="105" fill="none" stroke="#556B2F" stroke-width="1" stroke-dasharray="3 3" opacity="0.4"/>
        <!-- Stems -->
        <g stroke="#556B2F" stroke-width="1.8" fill="none" opacity="0.75">
          <line x1="0" y1="60" x2="0" y2="-50"/>
          <line x1="0" y1="60" x2="-45" y2="-35"/>
          <line x1="0" y1="60" x2="45" y2="-35"/>
          <line x1="0" y1="60" x2="-25" y2="-65"/>
          <line x1="0" y1="60" x2="25" y2="-65"/>
        </g>
        <!-- Chamomile / Daisies &amp; Poppies -->
        <g fill="#D48C46" opacity="0.85">
          <circle cx="0" cy="-55" r="9"/>
          <circle cx="-45" cy="-40" r="7.5"/>
          <circle cx="45" cy="-40" r="7.5"/>
          <circle cx="-25" cy="-70" r="8"/>
          <circle cx="25" cy="-70" r="8"/>
        </g>
        <!-- Daisy Petal Rings -->
        <circle cx="0" cy="-55" r="3.5" fill="#FFF8EE"/><circle cx="-45" cy="-40" r="3.5" fill="#FFF8EE"/><circle cx="45" cy="-40" r="3.5" fill="#FFF8EE"/><circle cx="-25" cy="-70" r="3.5" fill="#FFF8EE"/><circle cx="25" cy="-70" r="3.5" fill="#FFF8EE"/>
      </g>
    

  <!-- Typography -->
  <text x="300" y="470" text-anchor="middle" font-family="Georgia, serif" font-size="19" letter-spacing="7" fill="#D48C46" opacity="0.85">MEET US IN THE MEADOW</text>
  <line x1="210" y1="495" x2="275" y2="495" stroke="#D48C46" stroke-width="1.2" opacity="0.5"/>
  <circle cx="300" cy="495" r="3.5" fill="#D48C46" opacity="0.75"/>
  <line x1="325" y1="495" x2="390" y2="495" stroke="#D48C46" stroke-width="1.2" opacity="0.5"/>

  <text x="300" y="575" text-anchor="middle" font-family="Georgia, serif" font-size="52" font-style="italic" fill="#282C22">Wildflower Vows</text>
  <text x="300" y="630" text-anchor="middle" font-family="Georgia, serif" font-size="20" fill="#282C22" opacity="0.72">Groom &amp; Bride</text>
  <g opacity="0.55">
    <line x1="225" y1="680" x2="375" y2="680" stroke="#D48C46" stroke-width="1"/>
