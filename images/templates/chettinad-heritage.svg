  <line x1="325" y1="495" x2="390" y2="495" stroke="#C68841" stroke-width="1.2" opacity="0.5"/>

  <text x="300" y="575" text-anchor="middle" font-family="Georgia, serif" font-size="52" font-style="italic" fill="#3D2016">Chettinad Heritage</text>
  <text x="300" y="630" text-anchor="middle" font-family="Georgia, serif" font-size="20" fill="#3D2016" opacity="0.72">Groom &amp; Bride</text>
