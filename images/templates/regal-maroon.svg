<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 600 800" width="600" height="800" role="img" aria-label="Regal Maroon — wedding invitation template preview">
  <defs>
    <linearGradient id="bg-regal-maroon" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2E0814"/>
      <stop offset="55%" stop-color="#521226"/>
      <stop offset="100%" stop-color="#2E0814"/>
    </linearGradient>
    <radialGradient id="gl-regal-maroon" cx="50%" cy="34%" r="62%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="sh-regal-maroon" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.15"/>
      <stop offset="45%" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect x="0" y="0" width="600" height="800" fill="url(#bg-regal-maroon)"/>
  <rect x="0" y="0" width="600" height="800" fill="url(#gl-regal-maroon)"/>
  <rect x="0" y="0" width="600" height="800" fill="url(#sh-regal-maroon)"/>

  <!-- Custom Vector Art -->
  
      <!-- Antique Gold Baroque &amp; Damask Lace Corners -->
      <g stroke="#D4A745" fill="none" opacity="0.85">
        <rect x="36" y="36" width="528" height="728" stroke-width="2.5" rx="6"/>
        <rect x="46" y="46" width="508" height="708" stroke-width="1" stroke-dasharray="6 3" rx="4"/>
        <!-- 4 Ornate Corners -->
        <g stroke-width="1.8">
          <path d="M 46 96 C 76 96, 96 76, 96 46"/>
          <path d="M 554 96 C 524 96, 504 76, 504 46"/>
          <path d="M 46 704 C 76 704, 96 724, 96 754"/>
          <path d="M 554 704 C 524 704, 504 724, 504 754"/>
        </g>
      </g>
      <!-- Regal Gold Filigree Cartouche &amp; Velvet Crest -->
      <g transform="translate(300, 270)">
        <circle cx="0" cy="0" r="110" fill="none" stroke="#D4A745" stroke-width="2" opacity="0.6"/>
        <circle cx="0" cy="0" r="95" fill="none" stroke="#F0CF7D" stroke-width="1" stroke-dasharray="4 4"/>
        <!-- Ornate Oval Medallion -->
        <ellipse cx="0" cy="0" rx="65" ry="85" fill="#2E0814" stroke="#D4A745" stroke-width="3"/>
        <ellipse cx="0" cy="0" rx="55" ry="75" fill="none" stroke="#F0CF7D" stroke-width="1" stroke-dasharray="3 3"/>
        <!-- Royal Crown Motif -->
        <g fill="#D4A745">
          <path d="M -30 20 L -25 -15 L -10 5 L 0 -25 L 10 5 L 25 -15 L 30 20 Z"/>
          <circle cx="-25" cy="-20" r="3" fill="#F0CF7D"/>
          <circle cx="0" cy="-30" r="4" fill="#F0CF7D"/>
          <circle cx="25" cy="-20" r="3" fill="#F0CF7D"/>
        </g>
      </g>
    

  <!-- Typography -->
  <text x="300" y="470" text-anchor="middle" font-family="Georgia, serif" font-size="19" letter-spacing="7" fill="#F0CF7D" opacity="0.85">THE CORONATION OF LOVE</text>
  <line x1="210" y1="495" x2="275" y2="495" stroke="#F0CF7D" stroke-width="1.2" opacity="0.5"/>
  <circle cx="300" cy="495" r="3.5" fill="#F0CF7D" opacity="0.75"/>
  <line x1="325" y1="495" x2="390" y2="495" stroke="#F0CF7D" stroke-width="1.2" opacity="0.5"/>

  <text x="300" y="575" text-anchor="middle" font-family="Georgia, serif" font-size="52" font-style="italic" fill="#FFF2D9">Regal Maroon</text>
  <text x="300" y="630" text-anchor="middle" font-family="Georgia, serif" font-size="20" fill="#FFF2D9" opacity="0.72">Groom &amp; Bride</text>
  <g opacity="0.55">
    <line x1="225" y1="680" x2="375" y2="680" stroke="#F0CF7D" stroke-width="1"/>
  </g>
  <text x="300" y="720" text-anchor="middle" font-family="Georgia, serif" font-size="16" letter-spacing="4.5" fill="#FFF2D9" opacity="0.6">GRAND NOCTURNE WEDDING</text>
</svg>