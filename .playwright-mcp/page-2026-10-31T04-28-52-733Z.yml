        - heading "Everything You Need for Your Special Event ✦" [level=2] [ref=f3e60]
        - paragraph [ref=f3e61]: One link carries your whole invitation — the design, the details, the directions and the countdown. Guests open it on any phone, no app required.
      - group "Twelve features — scroll sideways, or use the arrow keys, to see them all" [ref=f3e62]:
