          - heading "Beautiful Templates" [level=3] [ref=f3e70]
          - paragraph [ref=f3e71]: Over three hundred hand-designed cards across seventeen occasions, from royal wedding gold to neon birthday nights.
        - article [ref=f3e72]:
          - heading "Easy Customisation" [level=3] [ref=f3e77]
          - paragraph [ref=f3e78]: Change names, dates, colours and fonts in a live editor. What you see is exactly what your guests receive.
        - article [ref=f3e79]:
          - heading "Mobile Friendly" [level=3] [ref=f3e83]
          - paragraph [ref=f3e84]: Built mobile-first and tested from 320px upward, so the card looks right on the oldest phone in the family.
        - article [ref=f3e85]:
          - heading "Share Anywhere" [level=3] [ref=f3e92]
          - paragraph [ref=f3e93]: One link works on WhatsApp, Facebook, Telegram, email and SMS. Copy it once and send it everywhere.
        - article [ref=f3e94]:
          - heading "Event Countdown" [level=3] [ref=f3e99]
          - paragraph [ref=f3e100]: A live timer ticks down to the moment — days, hours, minutes and seconds, updating on every open.
        - article [ref=f3e101]:
          - heading "Photo Gallery" [level=3] [ref=f3e107]
          - paragraph [ref=f3e108]: Add up to six photos of the couple, the baby or the venue and they appear right inside the invitation.
        - article [ref=f3e109]:
          - heading "Google Maps" [level=3] [ref=f3e114]
          - paragraph [ref=f3e115]: A Directions button opens the venue in the guest's own maps app — no more copying addresses by hand.
        - article [ref=f3e116]:
          - heading "Background Music" [level=3] [ref=f3e122]
          - paragraph [ref=f3e123]: Upload your own track. Guests start it with one tap on the music button, so it never plays unasked.
        - article [ref=f3e124]:
          - heading "QR Code" [level=3] [ref=f3e131]
          - paragraph [ref=f3e132]: Print the generated QR on your paper card so anyone can scan straight through to the digital version.
        - article [ref=f3e133]:
          - heading "Fast & Lightweight" [level=3] [ref=f3e137]
          - paragraph [ref=f3e138]: No heavy frameworks and no tracking scripts — the whole page is a few hundred kilobytes and loads instantly.
        - article [ref=f3e139]:
          - heading "Live Through Your Event" [level=3] [ref=f3e144]
          - paragraph [ref=f3e145]: Host once for ₹99. The link stays live until 31 days after your event, then the card and host page are deleted automatically — no renewals and no per-guest charges.
