<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Redesign Render</title>
<!-- Renders one invitation with the project's own, unmodified renderer
     (../js/preview.js + ../js/wedding-designs.js + ../css/style.css).
     ?slug=<slug>            -> original card
     ?slug=<slug>&rd=1       -> redesigned working copy from cards/<slug>/design.js -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,700&family=Playfair+Display:wght@600;700&family=Great+Vibes&family=Cormorant+Garamond:wght@600;700&family=Cinzel:wght@600;700;800&family=Noto+Serif+Telugu:wght@500;600;700&family=Noto+Serif+Tamil:wght@500;600;700&family=Marcellus&family=Parisienne&family=Bodoni+Moda:ital,wght@0,500;0,600;1,500&family=Josefin+Sans:wght@400;600&family=Allura&family=Libre+Baskerville:ital,wght@0,400;0,700;1,400&display=swap">
<link rel="stylesheet" href="../css/style.css">
<link rel="stylesheet" href="redesign.css">
<style>html,body{margin:0;background:#fff}#host{width:420px;margin:0}</style>
<script>
  (function () {
    var q = new URLSearchParams(location.search);
    window.RD_SLUG = q.get('slug');
    window.RD_ON = q.get('rd') === '1';
    if (window.RD_ON) document.write('<script src="cards/' + encodeURIComponent(window.RD_SLUG) + '/design.js"><\/script>');
  })();
</script>
<script src="../js/main.js" defer></script>
<script src="../js/templates.js" defer></script>
<script src="../js/countdown.js" defer></script>
<script src="../js/wedding-designs.js" defer></script>
<script src="redesign-hook.js" defer></script>
<script src="../js/preview.js" defer></script>
</head>
<body>
<div id="host"></div>
<script>document.getElementById('host').setAttribute('data-sample-invitation', window.RD_SLUG);</script>
</body>
</html>
