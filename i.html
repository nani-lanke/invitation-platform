<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>You're Invited | InviteAura</title>
<meta name="description" content="An invitation created with InviteAura.">
<meta name="theme-color" content="#FDFAFB">
<meta name="robots" content="noindex">

<meta property="og:type" content="website">
<meta property="og:site_name" content="InviteAura">
<meta property="og:title" content="You're Invited">
<meta property="og:description" content="Open your invitation.">

<link rel="icon" href="images/logo/favicon.svg" type="image/svg+xml">
<link rel="icon" href="images/logo/favicon-32.png" type="image/png" sizes="32x32">
<link rel="apple-touch-icon" href="images/logo/favicon-180.png">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,700&family=Playfair+Display:wght@600;700&family=Great+Vibes&family=Cormorant+Garamond:wght@600;700&family=Cinzel:wght@600;700;800&family=Noto+Serif+Telugu:wght@500;600;700&family=Noto+Serif+Tamil:wght@500;600;700&family=Marcellus&family=Parisienne&family=Bodoni+Moda:ital,wght@0,500;0,600;1,500&family=Josefin+Sans:wght@400;600&family=Allura&family=Libre+Baskerville:ital,wght@0,400;0,700;1,400&family=Fredoka:wght@500;600&family=Pacifico&family=Nunito:wght@500;700&display=swap">

<link rel="stylesheet" href="css/style.css?v=2.8">
<link rel="stylesheet" href="css/animations.css?v=1.2">
<link rel="stylesheet" href="css/responsive.css?v=1.6">

<script>(function(){try{var s=JSON.parse(localStorage.getItem('inviteaura:theme'));var m=s||(window.matchMedia&&window.matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light');document.documentElement.setAttribute('data-theme',m);}catch(e){}})();</script>

<script src="js/main.js?v=1.2" defer></script>
<script src="js/templates.js?v=2.5" defer></script>
<script src="js/countdown.js?v=1.2" defer></script>
<script src="js/wedding-designs.js?v=2.2" defer></script>
<script src="js/redesign-collection-data.js?v=1.2" defer></script>
<script src="js/redesign-collection.js?v=1.4" defer></script>
<script src="js/preview.js?v=2.3" defer></script>
<script src="js/share.js?v=1.3" defer></script>
<script src="js/link.js?v=1.2" defer></script>

<style>
  body{display:grid;place-items:center;min-height:100svh;padding:clamp(1rem,4vw,3rem) 1rem;
       background:linear-gradient(160deg,var(--surface-2),var(--surface-1))}
  .invite-page{width:min(100%,520px);display:grid;justify-items:center;gap:var(--space-5)}
  .invite-page__foot{text-align:center;font-size:.78rem;color:var(--fg-faint)}
  .invite-page__foot a{color:inherit}
</style>
</head>
<body>

<main class="invite-page" id="main">
  <div data-invite-host style="width:100%">
    <!-- Rendered from the link's fragment. The fallback below shows when
         the link is missing or was truncated in transit. -->
  </div>

  <p class="invite-page__foot">Created with <a href="index.html">InviteAura</a></p>
</main>

<noscript>
  <div class="container" style="max-width:36rem;margin-top:var(--space-7)">
    <div class="notice notice--warn">
      <div><strong>JavaScript is required</strong>This invitation is stored inside its own link, so the page needs JavaScript to read and display it.</div>
    </div>
  </div>
</noscript>

<script>
  document.addEventListener('DOMContentLoaded', function () {
    var host = document.querySelector('[data-invite-host]');
    var data = window.IH && IH.link ? IH.link.read() : null;

    if (!data) {
      host.innerHTML =
        '<div class="empty-state">' +
          (IH.icon ? IH.icon('mail', 56) : '') +
          '<h3>This invitation link looks incomplete</h3>' +
          '<p>The link may have been cut short when it was sent. Ask whoever invited you ' +
             'to send it again, making sure the whole address is copied.</p>' +
          '<a class="btn btn--primary" href="create.html">Create your own invitation</a>' +
        '</div>';
      return;
    }

    if (IH.invitation) {
      if (!data.customColors) IH.invitation.applyTemplate(data, data.template);
      IH.invitation.mount(host, data);
    }

    // Give the tab and any link preview the couple's real names.
    var names = data.namesSwapped ? [data.brideName, data.groomName] : [data.groomName, data.brideName];
    var who = names.filter(Boolean).join(' & ') ||
              data.personName || data.title;
    if (who) { document.title = who + ' | You are invited'; }
  });
</script>

</body>
</html>
